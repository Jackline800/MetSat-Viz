<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全臺測站建站年代分布</title>
<style>
:root{--ink:#26353d;--muted:#7a8992;--sea:#79cfe4;--sea2:#64bed8;--panel:#f7f9fa;--line:#d7e3e8;--accent:#2a7f9f;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#f3f6f7;color:var(--ink);overflow:hidden;display:grid;grid-template-columns:280px minmax(0,1fr)}
.header{height:100%;min-width:0;padding:18px 16px;border-right:1px solid #dde6ea;background:var(--panel);display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.title{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:.01em}
.summary{font-size:11px;line-height:1.55;color:#7e8c94;padding-bottom:12px;border-bottom:1px solid #e2e9ec}
.legend{display:grid;grid-template-columns:1fr;gap:8px;font-size:11px;color:#596a73;padding-bottom:12px;border-bottom:1px solid #e2e9ec}
.legend-item{display:inline-flex;align-items:center;gap:4px}
.legend-dot{width:8px;height:8px;border-radius:50%;border:1px solid #fff;box-shadow:0 0 0 1px rgba(30,55,68,.18)}
.legend-count{color:#94a0a7}
.filters{display:flex;flex-direction:column;gap:12px}
.multi-filter{width:100%;border:1px solid #cfd9de;border-radius:6px;background:#fff;overflow:hidden}
.multi-filter:focus-within{border-color:#78aeca;box-shadow:0 0 0 3px rgba(74,142,170,.14)}
.multi-filter summary{min-height:42px;padding:6px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;cursor:pointer;list-style:none}
.multi-filter summary::-webkit-details-marker{display:none}
.multi-filter summary::after{content:'▾';grid-column:2;grid-row:1/3;color:#71838c;transition:transform .15s ease}
.multi-filter[open] summary::after{transform:rotate(180deg)}
.multi-filter[open] summary{border-bottom:1px solid #e3eaed}
.multi-filter-label{font-size:11px;color:#6c7d86;font-weight:600}
.multi-filter-value{font-size:13px;color:#243840;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi-options{display:grid;gap:2px;padding:7px 9px 8px}
.multi-option{min-height:30px;display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:12px;color:#344952;cursor:pointer}
.multi-option input{width:15px;height:15px;margin:0;accent-color:var(--accent)}
.multi-clear{justify-self:start;margin-top:3px;padding:3px 2px;border:0;background:transparent;color:#287594;font-size:11px;cursor:pointer}
.multi-clear:hover{text-decoration:underline}
.filter-actions{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding-top:2px}
.btn{width:100%;height:36px;padding:0 14px;border:1px solid #c9d6dc;border-radius:6px;background:#fff;color:#28424c;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:#f1f6f8}
.filter-note{font-size:11px;line-height:1.45;color:#83929a}
.stage{height:100%;min-width:0;display:flex;align-items:center;justify-content:center;padding:14px}
.map-card{position:relative;height:min(100%,880px);aspect-ratio:0.97;max-width:100%;overflow:hidden;background:#7bcbe1;box-shadow:0 0 0 1px rgba(42,93,108,.12);isolation:isolate;border-radius:2px}
#mapSvg{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab}
#mapSvg.dragging{cursor:grabbing}
.terrain-image{pointer-events:none}
.coastline{fill:none;stroke:#3b5a50;stroke-width:1.05;vector-effect:non-scaling-stroke;pointer-events:none}
.grid-line{stroke:rgba(69,115,135,.20);stroke-width:1;shape-rendering:crispEdges}
.grid-line.minor{stroke-dasharray:2 3;stroke:rgba(69,115,135,.16)}
.frame{fill:none;stroke:#6d8b96;stroke-width:1.2;shape-rendering:crispEdges}
.axis-label{font-size:10px;fill:#5b7079;font-variant-numeric:tabular-nums;pointer-events:none}
.station{cursor:pointer;vector-effect:non-scaling-stroke;transition:r .08s ease,opacity .08s ease,stroke-width .08s ease;filter:url(#pointShadow)}
.station.current{stroke:#fff;stroke-width:.9;opacity:.95}
.station.closed{stroke:#4e5d64;stroke-width:1.0;opacity:.68}
.station:hover{r:5.8px;stroke-width:1.7;opacity:1}
.tooltip{position:absolute;z-index:20;display:none;min-width:215px;max-width:285px;padding:9px 11px;background:rgba(255,255,255,.98);border:1px solid rgba(52,79,91,.18);border-radius:7px;box-shadow:0 6px 20px rgba(20,50,62,.22);pointer-events:none;line-height:1.45;color:#283941}
.tt-title{font-size:14px;font-weight:700;margin-bottom:2px}.tt-row{font-size:12px;color:#3b4d56}.tt-label{color:#7a8991}.tt-cat{font-weight:650}.tt-coord{font-variant-numeric:tabular-nums}.tt-elev{color:#63747c}
.empty-state{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;display:none;min-width:220px;padding:14px 16px;background:rgba(255,255,255,.95);border:1px solid rgba(52,79,91,.14);border-radius:10px;box-shadow:0 6px 18px rgba(20,50,62,.15);text-align:center;color:#4b5d66}
.empty-state strong{display:block;font-size:15px;margin-bottom:4px}
.map-controls{position:absolute;right:12px;top:12px;z-index:10;display:flex;flex-direction:column;gap:6px}
.control-btn{width:36px;height:36px;border:1px solid rgba(48,78,90,.22);background:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 2px 10px rgba(30,55,68,.10);font-size:20px;line-height:1;color:#31515d;cursor:pointer}
.control-btn:hover{background:#fff}
.map-meta{margin-top:auto;padding-top:12px;border-top:1px solid #e2e9ec;display:grid;gap:10px}
.map-help{color:#546871;font-size:11px;line-height:1.5}
.map-help::before{content:'操作：';font-weight:600;color:#405660}
.map-source{color:#718188;font-size:10px;line-height:1.45}
.terrain-legend{width:100%;color:#465b64}
.terrain-legend-title{margin-bottom:4px;font-size:10px;font-weight:600}
.terrain-colorbar{height:10px;border:1px solid rgba(43,69,61,.24);background:linear-gradient(to right,#306991 0%,#3c82a6 15%,#4e9ebe 30%,#67b7cf 42%,#89ccd9 52%,#addee2 58%,#caeae5 60%,#edf1cf 60%,#deeab5 61%,#c7dc97 63.5%,#a6c977 67%,#7daa5b 72%,#678e4e 79%,#8e845b 87%,#b8a986 94%,#e0d8c5 100%)}
.terrain-ticks{display:flex;justify-content:space-between;margin-top:2px;color:#5f7077;font-size:9px;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  body{display:block;overflow:auto}
  .header{height:auto;padding:12px;border-right:0;border-bottom:1px solid #dde6ea;overflow:visible;gap:10px}
  .title{font-size:16px}
  .summary{padding-bottom:8px}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:10px}
  .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .filter-actions{grid-column:1/-1}
  .stage{height:72vh;min-height:480px;padding:8px}
}
@media (max-width:480px){
  .legend,.filters{grid-template-columns:1fr}
  .stage{height:68vh;min-height:420px}
  .summary,.filter-note,.map-help{font-size:10px}
}
</style>
</head>

<header class="header">

    <details class="multi-filter">

        <button type="button" class="multi-clear" data-filter="statusFilter">清除選取</button>
      </div>
    </details>
    <details class="multi-filter">
      <summary><span class="multi-filter-label">海拔分類</span><span class="multi-filter-value" id="elevFilterValue">全部</span></summary>
      <div class="multi-options" id="elevFilter">

        <label class="multi-option"><input type="checkbox" value="100–499 m"><span>100–499 m</span></label>
        <label class="multi-option"><input type="checkbox" value="500–999 m"><span>500–999 m</span></label>
        <label class="multi-option"><input type="checkbox" value="1000–1999 m"><span>1000–1999 m</span></label>
        <label class="multi-option"><input type="checkbox" value="2000 m 以上"><span>2000 m 以上</span></label>
        <button type="button" class="multi-clear" data-filter="elevFilter">清除選取</button>
      </div>
    </details>
    <div class="filter-actions">
      <button type="button" class="btn" id="resetFilters">重設篩選</button>
      <div class="filter-note" id="filterNote">目前顯示全部測站</div>
    </div>
  </div>
  <div class="map-meta">
    <div class="map-help">滑鼠滾輪縮放，拖曳平移</div>
    <div class="terrain-legend" aria-label="地形高程與水深色階，負 6000 至 4000 公尺">

      <div class="terrain-ticks"><span>-6000</span><span>-4000</span><span>-2000</span><span>0</span><span>2000</span><span>4000</span></div>
    </div>
    <div class="map-source">地形：ETOPO1 Ice<br>海岸線：Natural Earth 10m</div>
  </div>
</header>
<main class="stage">
  <div class="map-card" id="mapWrap">
    <svg id="mapSvg" role="img" aria-label="中央氣象署測站建站年代分布，可縮放及篩選"></svg>
    <div class="map-controls">
      <button type="button" class="control-btn" id="zoomIn" aria-label="放大">＋</button>
      <button type="button" class="control-btn" id="zoomOut" aria-label="縮小">－</button>
      <button type="button" class="control-btn" id="resetView" aria-label="重設視圖">⌂</button>

    <div class="empty-state" id="emptyState"><strong>查無測站</strong><span>請調整篩選條件。</span></div>
  </div>
</main>

const extent={minLon:117.80,maxLon:122.30,minLat:21.70,maxLat:26.55},cosLat=Math.cos(24.1*Math.PI/180);
let T={}, viewportGroup=null, plotBox={left:45,right:20,top:18,bottom:28}, zoomState={scale:1,tx:0,ty:0}, dragState=null;

function project(lon,lat){return {x:T.left+(lon-extent.minLon)*cosLat*T.scale,y:T.top+(extent.maxLat-lat)*T.scale}}
function el(name,attrs={}){const n=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function pathFrom(points){return points.map((p,i)=>{const q=project(p[0],p[1]);return `${i?'L':'M'}${q.x.toFixed(2)},${q.y.toFixed(2)}`}).join(' ')}
function coord(v){return Number(v).toFixed(4)}
function elevation(v){if(v===null||v===undefined||Number.isNaN(Number(v)))return '';const n=Number(v);return Number.isInteger(n)?String(n):n.toFixed(1)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function niceLon(v){return `${v.toFixed(v % 1 === 0 ? 0 : 1)}°E`}
function niceLat(v){return `${v.toFixed(v % 1 === 0 ? 0 : 1)}°N`}
function buildTickValues(min,max,step){const vals=[];let start=Math.ceil(min/step)*step;for(let v=start;v<=max+1e-9;v+=step) vals.push(Number(v.toFixed(4)));return vals}
function selectedInputs(root){return [...root.querySelectorAll('input[type="checkbox"]:checked')]}
function selectedValues(root){return new Set(selectedInputs(root).map(input=>input.value))}
function selectedLabels(root){return selectedInputs(root).map(input=>input.closest('.multi-option').querySelector('span').textContent)}
function matchesSelection(values,value){return values.size===0 || values.has(value)}
function updateFilterSummaries(){for(const config of filterConfigs){const labels=selectedLabels(config.root);config.valueNode.textContent=labels.length===0?'全部':labels.length===1?labels[0]:`已選 ${labels.length} 項`;}}
function getFilteredStations(){const types=selectedValues(typeFilter), categories=selectedValues(categoryFilter), statuses=selectedValues(statusFilter), elevations=selectedValues(elevFilter);return stations.filter(s=>matchesSelection(types,s.type)&&matchesSelection(categories,s.category)&&matchesSelection(statuses,s.status)&&matchesSelection(elevations,s.elevBand))}
function buildNote(){const parts=[];for(const config of filterConfigs){const labels=selectedLabels(config.root);if(labels.length) parts.push(`${config.noteLabel}：${labels.join('、')}`);}return parts.length?parts.join('｜'):'目前顯示全部測站'}
function updateLegend(filtered){const counts={};for(const c of categoryOrder) counts[c]=0;for(const s of filtered){if(counts[s.category]!==undefined) counts[s.category]++}for(const c of categoryOrder){const node=document.getElementById(`legend-${c}`);if(node) node.textContent=`(${counts[c]})`}}
function applyViewportTransform(){if(!viewportGroup) return; viewportGroup.setAttribute('transform',`translate(${zoomState.tx} ${zoomState.ty}) scale(${zoomState.scale})`);}
function resetView(){zoomState={scale:1,tx:0,ty:0};applyViewportTransform();hideTip();}
function zoomAt(px,py,factor){if(!viewportGroup) return; const old=zoomState.scale; const next=clamp(old*factor,1,8); if(Math.abs(next-old)<1e-6) return; const ratio=next/old; zoomState.tx = px - (px - zoomState.tx) * ratio; zoomState.ty = py - (py - zoomState.ty) * ratio; zoomState.scale=next; applyViewportTransform(); hideTip();}
function drawFrameAndGrid(){
  const g=el('g');
  const lonMinor=buildTickValues(Math.ceil(extent.minLon*2)/2, Math.floor(extent.maxLon*2)/2, 0.5);
  const latMinor=buildTickValues(Math.ceil(extent.minLat*2)/2, Math.floor(extent.maxLat*2)/2, 0.5);
  for(const lon of lonMinor){const p1=project(lon, extent.minLat), p2=project(lon, extent.maxLat); g.appendChild(el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:`grid-line${Number.isInteger(lon)?'':' minor'}`})); if(Number.isInteger(lon)){g.appendChild(el('text',{x:p1.x,y:T.top-6,class:'axis-label','text-anchor':'middle'})).appendChild(document.createTextNode(niceLon(lon))); g.appendChild(el('text',{x:p1.x,y:T.bottom+18,class:'axis-label','text-anchor':'middle'})).appendChild(document.createTextNode(niceLon(lon)));}}
  for(const lat of latMinor){const p1=project(extent.minLon, lat), p2=project(extent.maxLon, lat); g.appendChild(el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:`grid-line${Number.isInteger(lat)?'':' minor'}`})); if(Number.isInteger(lat)){const leftLabel=el('text',{x:T.left-8,y:p1.y+3,class:'axis-label','text-anchor':'end'}); leftLabel.appendChild(document.createTextNode(niceLat(lat))); g.appendChild(leftLabel); const rightLabel=el('text',{x:T.right+8,y:p1.y+3,class:'axis-label','text-anchor':'start'}); rightLabel.appendChild(document.createTextNode(niceLat(lat))); g.appendChild(rightLabel);}}
  g.appendChild(el('rect',{x:T.left,y:T.top,width:T.width,height:T.height,class:'frame'}));
  return g;
}
function render(){
  tooltip.style.display='none';
  svg.replaceChildren();
  const filtered=getFilteredStations();
  const w=wrap.clientWidth, h=wrap.clientHeight; svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  T.left=plotBox.left; T.top=plotBox.top; T.right=w-plotBox.right; T.bottom=h-plotBox.bottom; T.width=T.right-T.left; T.height=T.bottom-T.top;
  const spanX=(extent.maxLon-extent.minLon)*cosLat, spanY=extent.maxLat-extent.minLat; T.scale=Math.min(T.width/spanX, T.height/spanY);
  const usedW=spanX*T.scale, usedH=spanY*T.scale; T.left += (T.width-usedW)/2; T.right = T.left + usedW; T.top += (T.height-usedH)/2; T.bottom = T.top + usedH; T.width=usedW; T.height=usedH;

  const defs=el('defs');
  const sea=el('linearGradient',{id:'seaFill',x1:'0%',y1:'0%',x2:'100%',y2:'100%'}); sea.append(el('stop',{offset:'0%','stop-color':'#87d4e7'}),el('stop',{offset:'50%','stop-color':'#76cde2'}),el('stop',{offset:'100%','stop-color':'#66bfd9'})); defs.appendChild(sea);
  const shadow=el('filter',{id:'pointShadow',x:'-50%',y:'-50%',width:'200%',height:'200%'}); shadow.append(el('feDropShadow',{dx:'0',dy:'.35',stdDeviation:'.35','flood-color':'#20495b','flood-opacity':'.34'})); defs.appendChild(shadow);
  svg.appendChild(defs);
  svg.appendChild(el('rect',{x:0,y:0,width:w,height:h,fill:'#eef4f6'}));
  viewportGroup=el('g');
  viewportGroup.appendChild(el('rect',{x:T.left,y:T.top,width:T.width,height:T.height,fill:'url(#seaFill)'}));
  viewportGroup.appendChild(el('image',{x:T.left,y:T.top,width:T.width,height:T.height,href:terrainUrl,preserveAspectRatio:'none',class:'terrain-image'}));
  viewportGroup.appendChild(drawFrameAndGrid());
  const coastG=el('g');
  for(const line of coastLines){coastG.appendChild(el('path',{d:pathFrom(line),class:'coastline'}));}
  viewportGroup.appendChild(coastG);
  const stationG=el('g');
  for(const s of filtered){const p=project(s.lon,s.lat); const cls=s.status==='已撤銷'?'station closed':'station current'; const c=el('circle',{cx:p.x,cy:p.y,r:3.35,fill:colors[s.category]||'#666',class:cls}); c.addEventListener('mouseenter',e=>showTip(e,s)); c.addEventListener('mousemove',moveTip); c.addEventListener('mouseleave',hideTip); stationG.appendChild(c);}
  viewportGroup.appendChild(stationG);
  svg.appendChild(viewportGroup);
  applyViewportTransform();

  emptyState.style.display=filtered.length?'none':'block';
  const current=filtered.filter(s=>s.status==='現存').length, closed=filtered.filter(s=>s.status==='已撤銷').length;
  summaryText.textContent=`顯示 ${filtered.length} / ${totalCount} 站｜現存 ${current}｜已撤銷 ${closed}｜資料更新 2026-07-27`;
  updateFilterSummaries();
  filterNote.textContent=buildNote();
  updateLegend(filtered);
}
function showTip(ev,s){const color=colors[s.category]||'#666'; const closed=s.status==='已撤銷'&&s.end?`<div class="tt-row"><span class="tt-label">撤站日期：</span>${esc(s.end)}</div>`:''; tooltip.innerHTML=`<div class="tt-title">${esc(s.name)}（${esc(s.id)}）</div><div class="tt-row">${esc(s.type)}｜<span class="tt-cat" style="color:${color}">${esc(categoryLabels[s.category]||s.category)}</span></div><div class="tt-row"><span class="tt-label">狀態：</span>${esc(s.status)}</div><div class="tt-row"><span class="tt-label">建站日期：</span>${esc(s.start)}</div>${closed}<div class="tt-row"><span class="tt-label">海拔分類：</span>${esc(s.elevBand)}</div><div class="tt-row">${esc(s.county)}｜<span class="tt-coord">${coord(s.lon)}, ${coord(s.lat)}</span></div>${s.elev!==null?`<div class="tt-row tt-elev"><span class="tt-label">海拔：</span>${elevation(s.elev)} m</div>`:''}`; tooltip.style.display='block'; moveTip(ev);}
function moveTip(ev){const r=wrap.getBoundingClientRect(), tw=tooltip.offsetWidth, th=tooltip.offsetHeight; let x=ev.clientX-r.left+14, y=ev.clientY-r.top+14; if(x+tw>r.width-8) x=ev.clientX-r.left-tw-14; if(y+th>r.height-8) y=ev.clientY-r.top-th-14; tooltip.style.left=Math.max(8,x)+'px'; tooltip.style.top=Math.max(8,y)+'px';}
function hideTip(){tooltip.style.display='none';}
filterConfigs.forEach(config=>config.root.addEventListener('change',render));
document.querySelectorAll('.multi-clear').forEach(button=>button.addEventListener('click',()=>{document.getElementById(button.dataset.filter).querySelectorAll('input:checked').forEach(input=>input.checked=false);render();}));
resetBtn.addEventListener('click',()=>{filterConfigs.forEach(config=>config.root.querySelectorAll('input:checked').forEach(input=>input.checked=false));document.querySelectorAll('.multi-filter').forEach(filter=>filter.open=false);render();});
zoomInBtn.addEventListener('click',()=>zoomAt((T.left+T.right)/2,(T.top+T.bottom)/2,1.25));
zoomOutBtn.addEventListener('click',()=>zoomAt((T.left+T.right)/2,(T.top+T.bottom)/2,0.8));
resetViewBtn.addEventListener('click',resetView);
svg.addEventListener('wheel',e=>{e.preventDefault(); const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const loc=pt.matrixTransform(svg.getScreenCTM().inverse()); const factor=e.deltaY<0 ? 1.12 : 1/1.12; zoomAt(loc.x, loc.y, factor);},{passive:false});
svg.addEventListener('pointerdown',e=>{dragState={x:e.clientX,y:e.clientY,tx:zoomState.tx,ty:zoomState.ty}; svg.classList.add('dragging'); hideTip(); try{svg.setPointerCapture(e.pointerId)}catch(err){} });
svg.addEventListener('pointermove',e=>{if(!dragState) return; zoomState.tx=dragState.tx + (e.clientX-dragState.x); zoomState.ty=dragState.ty + (e.clientY-dragState.y); applyViewportTransform();});
function endDrag(e){if(!dragState) return; dragState=null; svg.classList.remove('dragging'); try{svg.releasePointerCapture(e.pointerId)}catch(err){} }
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointerleave',endDrag); svg.addEventListener('pointercancel',endDrag);
let resizeTimer; window.addEventListener('resize',()=>{clearTimeout(resizeTimer); resizeTimer=setTimeout(render,50);});
render();
</script>
</body>
</html>
