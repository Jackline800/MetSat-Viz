name: Update Himawari observation pause data

on:
  workflow_dispatch:

  # 每週一上午 09:00，臺灣時間
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Asia/Taipei"

concurrency:
  group: update-himawari-observation-pause
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Update Hima_ObsStop data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Run parser self-test
        run: |
          python Hima_ObsStop/update_data_stable.py --self-test

      - name: Update observation pause data
        run: |
          python Hima_ObsStop/update_data_stable.py

      - name: Confirm output file
        run: |
          test -f Hima_ObsStop/data.js
          echo "data.js size:"
          wc -c Hima_ObsStop/data.js

      - name: Commit and push data.js
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Hima_ObsStop/data.js

          if git diff --cached --quiet; then
            echo "Hima_ObsStop/data.js 沒有變更。"
          else
            git commit -m "chore: update Himawari observation pause data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare GitHub Pages files
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="_site" \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
